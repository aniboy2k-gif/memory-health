name: Test (bats)

# Target environment: macOS only (personal Mac Mini M4 tooling).
# CI runs on macos-latest to match the actual runtime — Linux is NOT a support
# target (CSR #962 decision). Earlier ubuntu runs were red on an env-specific
# detect_memory_dir test that never applied to the real environment.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + shellcheck (Homebrew)
        run: |
          brew install bats-core shellcheck
          bats --version
          shellcheck --version

      - name: Ensure python3 is available
        run: python3 --version

      - name: Run bats — install + scripts (기존 인프라)
        run: |
          bats tests/install.bats
          bats tests/scripts.bats

      - name: Run bats — Phase E TDD suite (R1~R6 + Red-Green)
        run: |
          bats tests/test-r1-r6.bats
          bats tests/r6-sidecar-idempotency.bats
          bats tests/red-green-tdd.bats

      - name: Run shell tests — rules drift detection (CSR #962)
        run: |
          bash tests/test-memory-health-state.sh
          bash tests/test-drift-check.sh
          bash tests/test-skill-update.sh

      - name: Run shell tests — SKILL split pointers (CSR #2503)
        run: bash tests/test-skill-split.sh

      - name: Run routine ledger tests (CSR #2491)
        run: |
          /usr/bin/python3 -m unittest tests/test_routine_items.py
          /usr/bin/python3 -m unittest tests/test_routine_audit.py
          /usr/bin/python3 -m unittest tests/test_routine_status.py
          # audit-record.sh update-check refuses to run without `timeout` (GNU coreutils; not on macOS runners)
          brew install coreutils
          PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH" bash tests/test-audit-record.sh
